# Include once inside nginx.conf's http {} (not inside server {}).
limit_req_zone $binary_remote_addr zone=ltli_public_qa:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=ltli_qa_clients:10m;

# Warning decisions are frequent UI actions; keep their quota separate from uploads/AI.
limit_req_zone $binary_remote_addr zone=ltli_qa_review:10m rate=30r/m;
