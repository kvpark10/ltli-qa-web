# Include inside the existing ltli.ai HTTPS server only.
# Keep all existing static-site locations, TLS, domains and redirects.
location ~ ^/api/qa/(check|report|assist|prepare|review)$ {
    client_max_body_size 29m;
    client_body_timeout 30s;
    limit_req zone=ltli_public_qa burst=3 nodelay;
    limit_req_status 429;
    limit_conn ltli_qa_clients 2;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8510;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 95s;
    proxy_connect_timeout 3s;
    proxy_next_upstream off;
    access_log off;
}
# Do not expose internal health or any other API routes.
location /api/qa/ { return 404; }
